name: First Spender localhost and blinded qualification
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tools/spend-lab/**'
      - 'tests/**'
      - 'package*.json'
      - 'tsconfig*.json'
      - '.github/workflows/spend-lab-successor.yml'
permissions:
  contents: read
jobs:
  exact-head-local-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FIRST_SPENDER_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.21.0
      - run: node tools/spend-lab/successor/source-manifest.mjs .data/first-spender/source-manifest.json
      - run: npm ci
      - run: npx tsc --noEmit && npx tsc -p tools/spend-lab/tsconfig.json
      - name: Boundary, lifecycle and canonical regressions
        run: npx vitest run tests/spend-lab-value.test.ts tests/spend-lab-successor.test.ts tests/spend-lab.test.ts tests/economic-judgment-engine.test.ts tests/economic-engine-api.test.ts tests/judgment-dx-sdk.test.ts tests/pre-spend-sdk.test.ts tests/unit/judgment-service.test.ts tests/decision-context.test.ts tests/integration/pre-spend-judgment.test.ts tests/integration/pre-spend-payment.test.ts
      - name: Reproduce paired local comparison
        run: npx tsx tools/spend-lab/successor/cli.ts .data/first-spender/comparison
      - name: Reproduce conservative two-stage experiment and risk-stratified net value
        run: npx tsx tools/spend-lab/successor/two-stage-cli.ts .data/first-spender/two-stage
      - name: Reproduce legacy safety matrix without updating frozen reports
        run: npx tsx tools/spend-lab/cli.ts --cases 1020 --concurrency 100 --output .data/first-spender/legacy
      - name: Confirm source remained unchanged
        run: node tools/spend-lab/successor/source-manifest.mjs .data/first-spender/source-manifest-after.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: first-spender-local-simulation-${{ github.event.pull_request.head.sha }}
          # Deliberate allowlist: no evaluator keys, SDK proofs, SQLite identities or raw proof publication.
          path: |
            .data/first-spender/source-manifest*.json
            .data/first-spender/comparison/comparison-metrics.json
            .data/first-spender/comparison/frozen-decisions.json
            .data/first-spender/comparison/label-commitment.json
            .data/first-spender/comparison/labels.json
            .data/first-spender/comparison/trust.json
            .data/first-spender/two-stage/registration.json
            .data/first-spender/two-stage/*net-value.json
            .data/first-spender/two-stage/two-stage-summary.json
            .data/first-spender/two-stage/*/comparison-metrics.json
            .data/first-spender/two-stage/*/frozen-decisions.json
            .data/first-spender/two-stage/*/label-commitment.json
            .data/first-spender/two-stage/*/labels.json
            .data/first-spender/two-stage/*/trust.json
            .data/first-spender/legacy/verification-report.json
          if-no-files-found: error
          retention-days: 14
