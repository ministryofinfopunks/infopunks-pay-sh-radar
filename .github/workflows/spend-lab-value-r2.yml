name: First Spender R2 economic value offline qualification
on:
  pull_request:
    paths:
      - "tools/spend-lab/value-r2/**"
      - "tests/spend-lab-value-r2.test.ts"
      - ".github/workflows/spend-lab-value-r2.yml"
permissions:
  contents: read
jobs:
  preregistered-offline-value:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FIRST_SPENDER_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.21.0
      - run: node tools/spend-lab/value-r2/source-manifest.mjs .data/value-r2/source-before.json
      - run: npm ci
      - run: npx tsc -p tools/spend-lab/tsconfig.json
      - run: npx vitest run tests/spend-lab-value-r2.test.ts
      - run: npx tsx tools/spend-lab/value-r2/cli.ts .data/value-r2/evaluation
      - run: npx tsx tools/spend-lab/value-r2/verify-retained.ts .data/value-r2/evaluation
      - run: node tools/spend-lab/value-r2/source-manifest.mjs .data/value-r2/source-after.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: first-spender-value-r2-${{ github.event.pull_request.head.sha }}
          include-hidden-files: true
          path: |
            .data/value-r2/source-*.json
            .data/value-r2/evaluation/summary.json
            .data/value-r2/evaluation/*-comparison.json
            .data/value-r2/evaluation/*-sensitivity.json
            .data/value-r2/evaluation/*-frozen-decisions.json
            .data/value-r2/evaluation/http-replay.json
            .data/value-r2/evaluation/provenance-audit.json
          if-no-files-found: error
          retention-days: 14
