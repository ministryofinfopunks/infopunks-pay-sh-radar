name: Spend Lab offline qualification
on:
  pull_request:
    paths:
      - "tools/spend-lab/**"
      - "tests/spend-lab.test.ts"
      - ".github/workflows/spend-lab.yml"
permissions:
  contents: read
jobs:
  local-simulation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.21.0
      - run: npm ci
      - run: npx tsc -p tools/spend-lab/tsconfig.json
      - run: npx vitest run tests/spend-lab.test.ts tests/economic-judgment-engine.test.ts tests/economic-engine-api.test.ts tests/pre-spend-sdk.test.ts tests/integration/pre-spend-judgment.test.ts tests/integration/pre-spend-payment.test.ts
      - run: npx tsx tools/spend-lab/cli.ts --cases 1020 --concurrency 100 --output .data/spend-lab/ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: spend-lab-simulation-${{ github.event.pull_request.head.sha }}
          path: .data/spend-lab/ci/*.json
          if-no-files-found: error
